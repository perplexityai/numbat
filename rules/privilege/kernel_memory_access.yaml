id: privilege.kernel_memory_access
version: "1.0"
enabled: true
title: Agent requested a raw kernel memory read or write
description: |-
  The agent requested a read or write of /dev/mem, /dev/kmem, or /proc/kcore, including the
  /proc/<pid>/root spelling of the same file. These files expose physical and kernel memory
  to ordinary file verbs, so one read dumps kernel secrets and one write patches the running
  kernel. A listing or metadata command discloses no memory, so it does not match.
severity: high
deny_message: Reading or writing raw kernel memory is not permitted in this environment. The restriction is on the file, not the tool, so do not retry with another verb, an interpreter, or a different path to the same file. Report the requirement to the workspace owner and continue without it.
expr: |-
  (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
  shell_commands.exists(command,
    (
      !command.argv.exists(arg, arg.matches("(?i)^(--help|--version)$")) &&
      (
        (
          command.name.matches("(?i)^(cat|less|more|head|tail|nl|tac|bat|base64|strings|xxd|hexdump|od|tee|cp)$") &&
          command.argv.slice(1, command.argv.size()).exists(arg,
            arg.matches("^(/proc/(self|[0-9]+)/root)?/+(dev/+(mem|kmem)|proc/+kcore)$")
          )
        ) ||
        (
          command.name.matches("(?i)^busybox$") &&
          command.argv.size() > 2 &&
          command.argv[1].matches("(?i)^(cat|less|more|head|tail|nl|tac|bat|base64|strings|xxd|hexdump|od|tee|cp)$") &&
          command.argv.slice(2, command.argv.size()).exists(arg,
            arg.matches("^(/proc/(self|[0-9]+)/root)?/+(dev/+(mem|kmem)|proc/+kcore)$")
          )
        ) ||
        (
          (
            command.name.matches("(?i)^dd$") ||
            (
              command.name.matches("(?i)^busybox$") &&
              command.argv.size() > 1 &&
              command.argv[1].matches("(?i)^dd$")
            )
          ) &&
          command.argv.slice(1, command.argv.size()).exists(arg,
            arg.matches("^(if|of)=(/proc/(self|[0-9]+)/root)?/+(dev/+(mem|kmem)|proc/+kcore)$")
          )
        )
      )
    ) ||
    command.redirects.exists(redirect,
      redirect.op in ["read", "read_write", "write", "append"] &&
      redirect.target.matches("^(/proc/(self|[0-9]+)/root)?/+(dev/+(mem|kmem)|proc/+kcore)$")
    )
  )
tags: [attack.t1611, kernel_memory_access]
