id: secrets.persisted_permission_credential
version: "1.0"
enabled: true
title: Credential persisted in an agent permission rule
description: |-
  An agent settings file stores a persisted allow rule whose text contains a literal
  credential, such as a password assignment, bearer token, URL userinfo or a well-known
  token format. Approving a command with "don't ask again" writes the full command into
  the rule, and these files are often copied, synced or committed. Expansions such as
  $VAR, $(...) and wildcards are not treated as literals.
severity: medium
expr: |-
  event.event_type == "permission.approved" &&
  event.source_type == "artifact" &&
  (
    event.tool_input.matches("(?i)(?:^|[^A-Za-z0-9_])[A-Za-z0-9_]*(?:PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|ACCESS_KEY|PRIVATE_KEY|MYSQL_PWD)=(?:'|\\\\\")?[^$\\s*<{%\\\\'\"()][^\\s'\"\\\\()]{7,}") ||
    event.tool_input.matches("(?i)(?:^|\\s)--(?:password|passwd|token|api-key|apikey|secret|client-secret|access-token|auth-token)(?:=|\\s+)(?:'|\\\\\")?[^$\\s*<{%\\\\'\"()-][^\\s'\"\\\\()]{7,}") ||
    event.tool_input.matches("(?i)(?:authorization:\\s*(?:bearer|basic|token)\\s+|x-[a-z0-9-]*(?:token|api-key|secret|auth)[a-z0-9-]*:\\s*|(?:^|[^a-z0-9-])api-key:\\s*)(?:'|\\\\\")?[^$\\s*<{%\\\\'\"()][^\\s'\"\\\\()]{7,}") ||
    event.tool_input.matches("[A-Za-z][A-Za-z0-9+.-]*://[^/\\s:@$'\"\\\\()]+:[^/\\s@$*<{%'\"\\\\()]{3,}@") ||
    event.tool_input.matches("(?:gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_-]{20,}|(?:AKIA|ASIA)[0-9A-Z]{16}|xox[abposr]-[A-Za-z0-9-]{10,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|npm_[A-Za-z0-9]{36}|pplx-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|X-Amz-Signature=[0-9a-f]{64})") ||
    event.tool_input.matches("(?:sshpass\\s+-p\\s*(?:'|\\\\\")?[^$\\s*<{%\\\\'\"()-]|(?:^|[\\s(;&|])(?:mysql|mysqldump|mysqladmin)\\s(?:[^;&|()]*\\s)?-p[^$\\s*<{%\\\\'\"()-])")
  )
tags: [credential_in_config, attack.t1552.001]
