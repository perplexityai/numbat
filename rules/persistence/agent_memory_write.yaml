id: persistence.agent_memory_write
version: "1.1"
enabled: true
title: Agent memory path targeted
description: |-
  A file event or shell mutator targeted a file under .agents/memory/. Muse Code injects
  the committed memory index and topic paths at session start, even in an untrusted
  workspace, and reads topic files on demand. A match does not establish malicious content.
# Compare literal slash-separated paths; canonical_path leaves symbolic paths unchanged.
# POSIX coverage is limited to redirects, tee with flag-only options, and option-free
# cp/mv/install (with an optional leading --). Do not guess sed script/file operands.
severity: medium
expr: |-
  (
    event.event_type == "file.write" &&
    canonical_path(event.file_path).matches("^([^\\\\$`]+/)?\\.agents/memory/[^\\\\$`]+$")
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.dialect == "posix" && (
        command.redirects.exists(redirect,
          redirect.op in ["write", "append"] &&
          !redirect.target_expands &&
          canonical_path(redirect.target).matches("^([^\\\\$`]+/)?\\.agents/memory/[^\\\\$`]+$")
        ) ||
        (
          !command.function_call &&
          command.arguments.all(arg, !arg.expands) &&
          (
            (
              command.name == "tee" &&
              command.argv.size() > 1 &&
              command.argv.slice(1, command.argv.size()).all(arg,
                !arg.startsWith("-") || arg in ["--", "-a", "--append", "-i", "--ignore-interrupts"]
              ) &&
              command.argv.slice(1, command.argv.size()).exists(arg,
                canonical_path(arg).matches("^([^\\\\$`]+/)?\\.agents/memory/[^\\\\$`]+$")
              )
            ) ||
            (
              command.name in ["cp", "mv", "install"] &&
              command.argv.size() > 2 &&
              (command.argv[1] != "--" || command.argv.size() > 3) &&
              lists.range(command.argv.size()).all(i,
                i == 0 || !command.argv[i].startsWith("-") || (i == 1 && command.argv[i] == "--")
              ) &&
              canonical_path(command.argv[command.argv.size() - 1]).matches("^([^\\\\$`]+/)?\\.agents/memory/[^\\\\$`]+$")
            )
          )
        )
      )
    )
  )
tags: [attack.t1565.001]
