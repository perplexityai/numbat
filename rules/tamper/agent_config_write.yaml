id: tamper.agent_config_write
version: "1.8"
enabled: true
title: Agent hook or settings file targeted
description: |-
  A file event observed, or a command requested, mutation of an endpoint agent's hook
  or settings surface. A successful change can disable monitoring or guardrails.
severity: high
expr: |-
  (
    (event.event_type == "file.write" || event.event_type == "file.delete") &&
    event.file_path.matches(
      "(?i)(^|/)(" +
      "\\.claude/settings(\\.local)?\\.json|" +
      "etc/claude-code/managed-(settings(\\.d/[^/]+)?|mcp)\\.json|" +
      "Library/Application Support/ClaudeCode/managed-(settings(\\.d/[^/]+)?|mcp)\\.json|" +
      "Program Files/ClaudeCode/managed-(settings(\\.d/[^/]+)?|mcp)\\.json|" +
      "\\.codex/hooks\\.json|etc/codex/(hooks\\.json|requirements\\.toml)|" +
      "ProgramData/OpenAI/Codex/requirements\\.toml|" +
      "\\.gemini/(settings\\.json|config/hooks\\.json)|" +
      "etc/gemini-cli/settings\\.json|Library/Application Support/GeminiCli/settings\\.json|" +
      "ProgramData/gemini-cli/settings\\.json|" +
      "\\.cursor/hooks\\.json|etc/cursor/hooks\\.json|" +
      "Library/Application Support/Cursor/hooks\\.json|ProgramData/Cursor/hooks\\.json|" +
      "\\.codeium/windsurf/hooks\\.json|\\.windsurf/hooks\\.json|etc/windsurf/hooks\\.json|" +
      "Library/Application Support/Windsurf/hooks\\.json|ProgramData/Windsurf/hooks\\.json|" +
      "\\.factory/(hooks(/hooks)?|settings(\\.local)?)\\.json|" +
      "\\.devin/hooks\\.v1\\.json|\\.config/devin/config\\.json|AppData/Roaming/devin/config\\.json|" +
      "\\.hermes/(config\\.yaml|profiles/[^/]+/config\\.yaml)|AppData/Local/hermes/(config\\.yaml|profiles/[^/]+/config\\.yaml)|" +
      "\\.copilot/settings\\.json|\\.copilot/hooks/[^/]+\\.json|" +
      "etc/github-copilot/policy\\.d/[^/]+\\.json|ProgramData/GitHub/Copilot/policy\\.d/[^/]+\\.json|" +
      "\\.github/(hooks/[^/]+|copilot/settings(\\.local)?\\.json)|" +
      "\\.grok/hooks/[^/]+|hooks/numbat\\.json|\\.agents/hooks\\.json|plugins/numbat\\.ts|\\.mcp\\.json|" +
      "\\.pi/agent/extensions/numbat\\.ts|\\.kimi-code/config\\.toml|" +
      "(openclaw|clawdbot)\\.json|extensions/numbat(/(openclaw\\.plugin\\.json|package\\.json|index\\.js))?/?|" +
      "\\.qwen/settings\\.json|etc/qwen-code/settings\\.json|Library/Application Support/QwenCode/settings\\.json|ProgramData/qwen-code/settings\\.json|" +
      "(\\.cline/hooks|\\.clinerules/hooks|Documents/Cline/Hooks)/(TaskStart|TaskResume|UserPromptSubmit|PreToolUse|PostToolUse|TaskComplete|TaskCancel|TaskError|SessionShutdown)(\\.ps1)?|" +
      "\\.augment/settings\\.json|etc/augment/settings\\.json|ProgramData/Augment/settings\\.json|" +
      "(\\.augment|etc/augment|ProgramData/Augment)/hooks/numbat--installed-by=numbat-(session_start|pre_tool|post_tool|stop|session_end)\\.(sh|ps1)|" +
      "\\.agents/plugins/numbat/(plugin\\.json|hooks/hooks\\.json)|\\.config/kilo/plugin/numbat\\.ts|" +
      "\\.openhands/hooks\\.json|\\.config/crush/crush\\.json|\\.crush\\.json|crush\\.json|\\.junie/config\\.json" +
      ")$"
    ) &&
    !event.file_path.matches(
      "(?i)(^|/)(\\.local/share/crush/crush\\.json|AppData/Local/crush/crush\\.json)$"
    ) &&
    !event.file_path.matches(
      "(?i)^/.+/(etc|Library/Application Support)/|^[A-Z]:/.+/(etc|Library/Application Support|ProgramData|Program Files)/"
    )
  ) || (
    (event.event_type == "command.exec" || (event.source_type == "otel" && event.event_type == "command.result")) &&
    shell_commands.exists(command,
      command.redirects.exists(redirect,
        redirect.op in ["write", "append"] &&
        redirect.target.matches(
          "(?i)(^|[\\\\/])(" +
          "\\.claude[\\\\/]settings(\\.local)?\\.json|etc[\\\\/]claude-code[\\\\/]managed-(settings(\\.d[\\\\/][^\\\\/]+)?|mcp)\\.json|" +
          "Library[\\\\/]Application Support[\\\\/]ClaudeCode[\\\\/]managed-(settings(\\.d[\\\\/][^\\\\/]+)?|mcp)\\.json|Program Files[\\\\/]ClaudeCode[\\\\/]managed-(settings(\\.d[\\\\/][^\\\\/]+)?|mcp)\\.json|" +
          "\\.codex[\\\\/]hooks\\.json|etc[\\\\/]codex[\\\\/](hooks\\.json|requirements\\.toml)|ProgramData[\\\\/]OpenAI[\\\\/]Codex[\\\\/]requirements\\.toml|" +
          "\\.gemini[\\\\/](settings\\.json|config[\\\\/]hooks\\.json)|etc[\\\\/]gemini-cli[\\\\/]settings\\.json|Library[\\\\/]Application Support[\\\\/]GeminiCli[\\\\/]settings\\.json|ProgramData[\\\\/]gemini-cli[\\\\/]settings\\.json|" +
          "\\.cursor[\\\\/]hooks\\.json|etc[\\\\/]cursor[\\\\/]hooks\\.json|Library[\\\\/]Application Support[\\\\/]Cursor[\\\\/]hooks\\.json|ProgramData[\\\\/]Cursor[\\\\/]hooks\\.json|" +
          "\\.codeium[\\\\/]windsurf[\\\\/]hooks\\.json|\\.windsurf[\\\\/]hooks\\.json|etc[\\\\/]windsurf[\\\\/]hooks\\.json|Library[\\\\/]Application Support[\\\\/]Windsurf[\\\\/]hooks\\.json|ProgramData[\\\\/]Windsurf[\\\\/]hooks\\.json|" +
          "\\.factory[\\\\/](hooks([\\\\/]hooks)?|settings(\\.local)?)\\.json|\\.devin[\\\\/]hooks\\.v1\\.json|\\.config[\\\\/]devin[\\\\/]config\\.json|AppData[\\\\/]Roaming[\\\\/]devin[\\\\/]config\\.json|" +
          "\\.hermes[\\\\/](config\\.yaml|profiles[\\\\/][^\\\\/]+[\\\\/]config\\.yaml)|AppData[\\\\/]Local[\\\\/]hermes[\\\\/](config\\.yaml|profiles[\\\\/][^\\\\/]+[\\\\/]config\\.yaml)|" +
          "\\.copilot[\\\\/](settings\\.json|hooks[\\\\/][^\\\\/]+\\.json)|etc[\\\\/]github-copilot[\\\\/]policy\\.d[\\\\/][^\\\\/]+\\.json|ProgramData[\\\\/]GitHub[\\\\/]Copilot[\\\\/]policy\\.d[\\\\/][^\\\\/]+\\.json|" +
          "\\.github[\\\\/](hooks[\\\\/][^\\\\/]+|copilot[\\\\/]settings(\\.local)?\\.json)|\\.grok[\\\\/]hooks[\\\\/][^\\\\/]+|hooks[\\\\/]numbat\\.json|\\.agents[\\\\/]hooks\\.json|plugins[\\\\/]numbat\\.ts|\\.mcp\\.json|" +
          "\\.pi[\\\\/]agent[\\\\/]extensions[\\\\/]numbat\\.ts|\\.kimi-code[\\\\/]config\\.toml|(openclaw|clawdbot)\\.json|extensions[\\\\/]numbat([\\\\/](openclaw\\.plugin\\.json|package\\.json|index\\.js))?[\\\\/]?|" +
          "\\.qwen[\\\\/]settings\\.json|etc[\\\\/]qwen-code[\\\\/]settings\\.json|Library[\\\\/]Application Support[\\\\/]QwenCode[\\\\/]settings\\.json|ProgramData[\\\\/]qwen-code[\\\\/]settings\\.json|" +
          "(\\.cline[\\\\/]hooks|\\.clinerules[\\\\/]hooks|Documents[\\\\/]Cline[\\\\/]Hooks)[\\\\/](TaskStart|TaskResume|UserPromptSubmit|PreToolUse|PostToolUse|TaskComplete|TaskCancel|TaskError|SessionShutdown)(\\.ps1)?|" +
          "\\.augment[\\\\/]settings\\.json|etc[\\\\/]augment[\\\\/]settings\\.json|ProgramData[\\\\/]Augment[\\\\/]settings\\.json|" +
          "(\\.augment|etc[\\\\/]augment|ProgramData[\\\\/]Augment)[\\\\/]hooks[\\\\/]numbat--installed-by=numbat-(session_start|pre_tool|post_tool|stop|session_end)\\.(sh|ps1)|" +
          "\\.agents[\\\\/]plugins[\\\\/]numbat[\\\\/](plugin\\.json|hooks[\\\\/]hooks\\.json)|\\.config[\\\\/]kilo[\\\\/]plugin[\\\\/]numbat\\.ts|" +
          "\\.openhands[\\\\/]hooks\\.json|\\.config[\\\\/]crush[\\\\/]crush\\.json|\\.crush\\.json|crush\\.json|\\.junie[\\\\/]config\\.json" +
          ")$"
        ) &&
        !redirect.target.matches("(?i)(^|[\\\\/])(\\.local[\\\\/]share[\\\\/]crush[\\\\/]crush\\.json|AppData[\\\\/]Local[\\\\/]crush[\\\\/]crush\\.json)$") &&
        !redirect.target.matches("(?i)^.+[\\\\/](etc|Library[\\\\/]Application Support)[\\\\/]|^[A-Z]:.+[\\\\/](etc|Library[\\\\/]Application Support|ProgramData|Program Files)[\\\\/]")
      ) ||
      (
        (
          command.name.matches("(?i)^(rm|truncate|tee|mv)$") ?
            lists.range(command.argv.size()).slice(1, command.argv.size()) :
          (
            command.name.matches("(?i)^sed$") &&
            command.argv.exists(arg, arg.matches("(?i)^(-i|--in-place)(=.*)?$"))
          ) ?
            lists.range(command.argv.size()).slice(1, command.argv.size()) :
          command.name.matches("(?i)^(cp|install)$") ?
            [
              command.argv.exists(arg, arg.matches("(?i)^(-t|--target-directory)(=.*)?$")) ?
                -1 :
                command.argv.size() - 1
            ] :
          command.name.matches("(?i)^(set-content|add-content|clear-content|out-file|remove-item|ri|new-item)$") ?
            lists.range(command.argv.size()).filter(i,
              i > 0 &&
              (
                i == 1 ||
                command.argv[i - 1].matches("(?i)^-(path|literalpath|filepath)$")
              )
            ) :
          command.name.matches("(?i)^copy-item$") ?
            lists.range(command.argv.size()).filter(i,
              i > 0 &&
              command.argv[i - 1].matches("(?i)^-destination$")
            ) :
          command.name.matches("(?i)^move-item$") ?
            lists.range(command.argv.size()).filter(i,
              i > 0 &&
              (
                i == 1 ||
                command.argv[i - 1].matches("(?i)^-(path|literalpath|destination)$") ||
                i == command.argv.size() - 1
              )
            ) :
          lists.range(0)
        ) +
        [
          command.name.matches("(?i)^(set-content|add-content|clear-content|out-file|remove-item|ri|new-item)$") ?
            (
              lists.range(command.argv.size()).filter(i,
                i > 0 &&
                !command.argv[i].matches("(?i)^-(force|nonewline|passthru|append|noclobber|recurse|whatif|confirm)(:.*)?$")
              ) + [-1]
            )[0] :
          command.name.matches("(?i)^copy-item$") ?
            (
              lists.range(command.argv.size()).filter(i,
                i > 0 &&
                !command.argv[i].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
              ).reverse() + [-1]
            )[0] :
          command.name.matches("(?i)^move-item$") ?
            (
              lists.range(command.argv.size()).filter(i,
                i > 0 &&
                !command.argv[i].matches("(?i)^-(force|recurse|container|passthru|whatif|confirm)(:.*)?$")
              ) + [-1]
            )[0] :
          -1
        ]
      ).exists(i,
        i > 0 &&
        i < command.argv.size() &&
        command.argv[i].matches(
          "(?i)(^|[\\\\/])(" +
          "\\.claude[\\\\/]settings(\\.local)?\\.json|etc[\\\\/]claude-code[\\\\/]managed-(settings(\\.d[\\\\/][^\\\\/]+)?|mcp)\\.json|Library[\\\\/]Application Support[\\\\/]ClaudeCode[\\\\/]managed-(settings(\\.d[\\\\/][^\\\\/]+)?|mcp)\\.json|Program Files[\\\\/]ClaudeCode[\\\\/]managed-(settings(\\.d[\\\\/][^\\\\/]+)?|mcp)\\.json|" +
          "\\.codex[\\\\/]hooks\\.json|etc[\\\\/]codex[\\\\/](hooks\\.json|requirements\\.toml)|ProgramData[\\\\/]OpenAI[\\\\/]Codex[\\\\/]requirements\\.toml|" +
          "\\.gemini[\\\\/](settings\\.json|config[\\\\/]hooks\\.json)|etc[\\\\/]gemini-cli[\\\\/]settings\\.json|Library[\\\\/]Application Support[\\\\/]GeminiCli[\\\\/]settings\\.json|ProgramData[\\\\/]gemini-cli[\\\\/]settings\\.json|" +
          "\\.cursor[\\\\/]hooks\\.json|etc[\\\\/]cursor[\\\\/]hooks\\.json|Library[\\\\/]Application Support[\\\\/]Cursor[\\\\/]hooks\\.json|ProgramData[\\\\/]Cursor[\\\\/]hooks\\.json|" +
          "\\.codeium[\\\\/]windsurf[\\\\/]hooks\\.json|\\.windsurf[\\\\/]hooks\\.json|etc[\\\\/]windsurf[\\\\/]hooks\\.json|Library[\\\\/]Application Support[\\\\/]Windsurf[\\\\/]hooks\\.json|ProgramData[\\\\/]Windsurf[\\\\/]hooks\\.json|" +
          "\\.factory[\\\\/](hooks([\\\\/]hooks)?|settings(\\.local)?)\\.json|\\.devin[\\\\/]hooks\\.v1\\.json|\\.config[\\\\/]devin[\\\\/]config\\.json|AppData[\\\\/]Roaming[\\\\/]devin[\\\\/]config\\.json|\\.hermes[\\\\/](config\\.yaml|profiles[\\\\/][^\\\\/]+[\\\\/]config\\.yaml)|AppData[\\\\/]Local[\\\\/]hermes[\\\\/](config\\.yaml|profiles[\\\\/][^\\\\/]+[\\\\/]config\\.yaml)|" +
          "\\.copilot[\\\\/](settings\\.json|hooks[\\\\/][^\\\\/]+\\.json)|etc[\\\\/]github-copilot[\\\\/]policy\\.d[\\\\/][^\\\\/]+\\.json|ProgramData[\\\\/]GitHub[\\\\/]Copilot[\\\\/]policy\\.d[\\\\/][^\\\\/]+\\.json|\\.github[\\\\/](hooks[\\\\/][^\\\\/]+|copilot[\\\\/]settings(\\.local)?\\.json)|" +
          "\\.grok[\\\\/]hooks[\\\\/][^\\\\/]+|hooks[\\\\/]numbat\\.json|\\.agents[\\\\/]hooks\\.json|plugins[\\\\/]numbat\\.ts|\\.mcp\\.json|\\.pi[\\\\/]agent[\\\\/]extensions[\\\\/]numbat\\.ts|\\.kimi-code[\\\\/]config\\.toml|(openclaw|clawdbot)\\.json|extensions[\\\\/]numbat([\\\\/](openclaw\\.plugin\\.json|package\\.json|index\\.js))?[\\\\/]?|" +
          "\\.qwen[\\\\/]settings\\.json|etc[\\\\/]qwen-code[\\\\/]settings\\.json|Library[\\\\/]Application Support[\\\\/]QwenCode[\\\\/]settings\\.json|ProgramData[\\\\/]qwen-code[\\\\/]settings\\.json|(\\.cline[\\\\/]hooks|\\.clinerules[\\\\/]hooks|Documents[\\\\/]Cline[\\\\/]Hooks)[\\\\/](TaskStart|TaskResume|UserPromptSubmit|PreToolUse|PostToolUse|TaskComplete|TaskCancel|TaskError|SessionShutdown)(\\.ps1)?|" +
          "\\.augment[\\\\/]settings\\.json|etc[\\\\/]augment[\\\\/]settings\\.json|ProgramData[\\\\/]Augment[\\\\/]settings\\.json|(\\.augment|etc[\\\\/]augment|ProgramData[\\\\/]Augment)[\\\\/]hooks[\\\\/]numbat--installed-by=numbat-(session_start|pre_tool|post_tool|stop|session_end)\\.(sh|ps1)|\\.agents[\\\\/]plugins[\\\\/]numbat[\\\\/](plugin\\.json|hooks[\\\\/]hooks\\.json)|\\.config[\\\\/]kilo[\\\\/]plugin[\\\\/]numbat\\.ts|\\.openhands[\\\\/]hooks\\.json|\\.config[\\\\/]crush[\\\\/]crush\\.json|\\.crush\\.json|crush\\.json|\\.junie[\\\\/]config\\.json" +
          ")$"
        ) &&
        !command.argv[i].matches("(?i)(^|[\\\\/])(\\.local[\\\\/]share[\\\\/]crush[\\\\/]crush\\.json|AppData[\\\\/]Local[\\\\/]crush[\\\\/]crush\\.json)$|^(\\$env:LOCALAPPDATA|%LOCALAPPDATA%)[\\\\/]crush[\\\\/]crush\\.json$") &&
        !command.argv[i].matches("(?i)^.+[\\\\/](etc|Library[\\\\/]Application Support)[\\\\/]|^[A-Z]:.+[\\\\/](etc|Library[\\\\/]Application Support|ProgramData|Program Files)[\\\\/]")
      )
    )
  )
tags: [attack.t1562.001]
